# 哔哩哔哩
# 网页PC @fan
# 1. 统一移动端跳转至 PC 端（捕获路径参数，实现自动映射）
^https?:\/\/m\.bilibili\.com\/(video|space|search|h5)\/?(.*) url 302 https://$1.bilibili.com/$2
# 2. 统一伪装请求头（匹配所有 bilibili 子域名，忽略大小写，利用 ?: 避免不必要的捕获组）
^https?:\/\/(?:www|space|live|search)\.bilibili\.com url request-header (?i)(\r\n(?:user-agent|sec-ch-ua-mobile|sec-ch-ua-platform):)[^\r\n]+ request-header $1 REPLACE_HEADER_VALUE
# 3. 统一注入防守策略
^https?:\/\/(?:www|space|live|search)\.bilibili\.com url response-body (?i)(<head[^>]*>) response-body $1<meta name="viewport" content="width=1200,initial-scale=0.3"><script>Object.defineProperty(navigator,"userAgent",{get:()=>"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0"});window.innerWidth=1200;</script>
