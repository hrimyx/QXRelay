#
# Rewrite 功能解锁 通用
# 
# 



# ====================分割线====================



hostname = spclient.wg.spotify.com, *spclient.spotify.com,  



# ====================分割线====================



# Spotify VIP @app2smile https://github.com/app2smile/rules 最后25.6.27
# https://raw.githubusercontent.com/Amlabort/MY_clash/refs/heads/main/files/surge/spot-NoAd.module
# 现在合并测试
# host, aet.spotify.com, reject

# proto 解包：去广告+解锁会员（原作者已写 QX 分支，直接引用原地址）
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ url script-response-body https://raw.githubusercontent.com/Amlabort/MY_clash/refs/heads/main/files/lpx/js/spot-proto-ev3.js

# 删请求头 if-none-match（等价于 Surge 的 header-del），让 customize 接口回 200 而不是 304
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ url script-request-header https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-qx-header.js

# gabo 广告上报：伪造 200 空响应（QX 必须用 script-echo-response，见 spot-gabo-qx.js 头注）
^https:\/\/(.*-spclient\.spotify\.com(:443)?|spclient\.wg\.spotify\.com)\/gabo-receiver-service url script-echo-response https://raw.githubusercontent.com/hrimyx/QXRelay/master/JS/Rewrite/spotify-gabo.js
# 去广告三合一：搜索页 / 首页 / 滚动页
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(browsita\/v.\/browse|casita\/v.\/home\/default|scrollsita\/v.\/scroll\/spotify) url script-response-body https://raw.githubusercontent.com/hrimyx/QXRelay/master/JS/Rewrite/spotify-ad.js
# 屏蔽弹窗广告 + 设置页会员信息（仅影响展示）
^https:\/\/(spclient\.wg|.*-spclient)\.spotify\.com(:443)?\/(pendragon|pam-view-service\/) url reject-200
# 屏蔽 AI DJ
^https:\/\/.*37i9dQZF1EYkqdzj48dyYq url reject-200

